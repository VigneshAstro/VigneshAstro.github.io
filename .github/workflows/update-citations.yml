name: Update Google Scholar Citations

on:
  push:
    branches: [main]
    paths:
      - "bin/update_scholar_citations.py"
      - ".github/workflows/update-citations.yml"
      - "_data/socials.yml"
  schedule:
    - cron: "17 0 * * 1,3,5" # Monday, Wednesday, Friday (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        # scholarly 1.x imports the BibDatabase API removed in bibtexparser 2.
        run: python -m pip install pyyaml 'scholarly>=1.7,<2' 'bibtexparser<2'

      - name: Check citation updater
        run: python -m unittest discover -s test -p 'test_update_scholar_citations.py'

      - name: Refresh citations
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          timeout 120 python bin/update_scholar_citations.py
          echo "Scholar citations checked successfully." >> "$GITHUB_STEP_SUMMARY"

      - name: Report failed refresh
        if: failure()
        run: |
          echo "Citation refresh failed. The existing published citation data has been retained; see the failed step for details." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit citation changes
        run: |
          if git diff --quiet -- _data/citations.yml; then
            echo "No citation changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/citations.yml
          git commit -m "Update Google Scholar citations"
          git pull --rebase origin main
          git push
